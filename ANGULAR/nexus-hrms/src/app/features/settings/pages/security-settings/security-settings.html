<div class="security-settings-container">
  <div class="card">
    <h2>Change Password</h2>
    <p class="subtitle">Ensure your account uses a strong and unique password.</p>

    <!-- Notifications -->
    <div *ngIf="successMessage()" class="alert alert-success">
      {{ successMessage() }}
    </div>

    <div *ngIf="errorMessage()" class="alert alert-error">
      {{ errorMessage() }}
    </div>

    <!-- Form -->
    <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="currentPassword">Current Password</label>
        <input
          id="currentPassword"
          type="password"
          formControlName="currentPassword"
          [class.is-invalid]="isFieldInvalid('currentPassword')"
        />
        <small *ngIf="isFieldInvalid('currentPassword')" class="error-text">
          Current password is required.
        </small>
      </div>

      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input
          id="newPassword"
          type="password"
          formControlName="newPassword"
          [class.is-invalid]="isFieldInvalid('newPassword')"
        />
        <small *ngIf="passwordForm.get('newPassword')?.hasError('required') && isFieldInvalid('newPassword')" class="error-text">
          New password is required.
        </small>
        <small *ngIf="passwordForm.get('newPassword')?.hasError('minlength') && isFieldInvalid('newPassword')" class="error-text">
          Password must be at least 8 characters long.
        </small>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm New Password</label>
        <input
          id="confirmPassword"
          type="password"
          formControlName="confirmPassword"
          [class.is-invalid]="isFieldInvalid('confirmPassword') || passwordForm.hasError('mismatch')"
        />
        <small *ngIf="isFieldInvalid('confirmPassword')" class="error-text">
          Please confirm your new password.
        </small>
        <small *ngIf="passwordForm.hasError('mismatch') && passwordForm.get('confirmPassword')?.touched" class="error-text">
          New password and confirm password do not match.
        </small>
      </div>

      <div class="form-actions">
        <button
          type="submit"
          class="btn-primary"
          [disabled]="passwordForm.invalid || isSubmitting()"
        >
          {{ isSubmitting() ? 'Updating...' : 'Update Password' }}
        </button>
      </div>
    </form>
  </div>
</div>
