<div class="login-wrapper">
  <div class="login-card">
    <h2>Sign In</h2>

    <!-- Global Alert Messages -->
    <div *ngIf="errorMessage" class="alert alert-danger" role="alert">
      {{ errorMessage }}
    </div>
    
    <div *ngIf="successMessage" class="alert alert-success" role="alert">
      {{ successMessage }}
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>
      <!-- Username / Email Field -->
      <div class="form-control">
        <label for="email">Username / Email</label>
        <input
          id="email"
          type="text"
          formControlName="email"
          placeholder="admin"
          [class.invalid]="isSubmitted && f['email'].errors"
        />
        <div *ngIf="isSubmitted && f['email'].errors" class="error-msg">
          <small *ngIf="f['email'].errors['required']">Username or Email is required.</small>
          <small *ngIf="f['email'].errors['email']">Enter a valid email address.</small>
        </div>
      </div>

      <!-- Password Field with Toggle -->
      <div class="form-control">
        <label for="password">Password</label>
        <div class="password-input-group">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            [class.invalid]="isSubmitted && f['password'].errors"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="togglePasswordVisibility()"
            tabindex="-1"
          >
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>
        </div>
        <div *ngIf="isSubmitted && f['password'].errors" class="error-msg">
          <small *ngIf="f['password'].errors['required']">Password is required.</small>
          <small *ngIf="f['password'].errors['minlength']">At least 6 characters required.</small>
        </div>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn-primary" [disabled]="isLoading">
        <span *ngIf="!isLoading">Login</span>
        <span *ngIf="isLoading" class="loading-state">
          <span class="spinner"></span> Authenticating...
        </span>
      </button>
    </form>
  </div>
</div>
